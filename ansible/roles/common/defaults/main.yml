---
common_packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - less
  - python3-debian    # deb822_repository needs it
  - python3-pymysql   # community.mysql modules run on the host and need it
  - python3-venv
  - rsync
  - tzdata

# Only these users may log in over SSH, and only with a key.
common_ssh_allow_users: [ansible]

common_journal_max_use: 200M
