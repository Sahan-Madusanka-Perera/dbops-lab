# Run from this directory (make vm-provision does): paths below are relative to it.
[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
collections_path = collections
interpreter_python = /usr/bin/python3
retry_files_enabled = False
# a run that fails halfway still restarts what it already changed (sshd, mariadb)
force_handlers = True
callback_result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=../secrets/vm_known_hosts -o StrictHostKeyChecking=accept-new
