name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/*/*.sh drills/*.sh
      - name: compose file is valid
        run: cp .env.example .env && docker compose config --quiet

  lint-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ansible-lint (production profile)
        working-directory: ansible
        run: |
          pip install "ansible-core>=2.17" "ansible-lint>=24"
          ansible-galaxy collection install -r requirements.yml -p collections
          ansible-lint
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
